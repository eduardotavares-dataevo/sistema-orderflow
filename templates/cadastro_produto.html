{% extends "base.html" %}

{% block conteudo %}

<h2>Cadastrar Produto</h2>
<form action="/cadastro" method="post">
    <input type="text" name="nome" placeholder="Insira o nome..." required>
    <input type="number" step="0.01" min="0" name="preco" placeholder="Insira o preço..." required>
    <div class="grid">
        <button type="submit">Cadastrar</button>
        <button type="button" class="secondary" onclick="window.location.href='/produtos'">Cancelar</button>
    </div>
</form>

{% endblock %}
